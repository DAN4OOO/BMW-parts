<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Register — BMW Parts Catalog</title>
  <link rel="stylesheet" th:href="@{/css/main.css}"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
</head>
<body class="page-auth">

<nav class="navbar">
  <div class="nav-inner">
    <a class="brand" href="/">
      <span class="brand-logo">BMW</span>
      <span class="brand-sub">Parts Catalog</span>
    </a>
    <div class="nav-links">
      <a href="/" class="nav-link">Home</a>
      <a href="/login" class="nav-link">Sign In</a>
    </div>
  </div>
</nav>

<main class="auth-main">
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-logo">BMW</div>
      <h1 class="auth-title">Create Account</h1>
      <p class="auth-subtitle">Join to save your garage and search history</p>
    </div>

    <div th:if="${registrationError}" class="alert-error">
      <span class="alert-icon">⚠</span>
      <span th:text="${registrationError}"></span>
    </div>

    <form class="auth-form" th:action="@{/do-register}" method="POST">
      <div class="form-group">
        <label for="fullName">Full Name</label>
        <input type="text" id="fullName" name="fullName" required />
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required minlength="6" />
        <small>Minimum 6 characters</small>
      </div>
      <button type="submit" class="btn-auth">Create Account</button>
    </form>

    <div class="auth-footer">
      Already have an account? <a href="/login">Sign in here</a>
    </div>
  </div>
</main>

<footer class="site-footer">
  <div class="footer-inner">
    <span>BMW Parts Catalog © 2024</span>
    <span>Данни от NHTSA и BMW OEM база данни</span>
  </div>
</footer>

</body>
</html>
