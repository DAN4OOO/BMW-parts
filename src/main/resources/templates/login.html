<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Вход — BMW Каталог с части</title>
  <link rel="stylesheet" th:href="@{/css/main.css}"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <script th:src="@{/js/theme.js}"></script>
</head>
<body class="page-auth">

<nav class="navbar">
  <div class="nav-inner">
    <a class="brand" href="/">
      <span class="brand-logo">BMW</span>
      <span class="brand-sub">Каталог с части</span>
    </a>
    <div class="nav-links">
      <a href="/" class="nav-link">Начало</a>
      <a href="/register" class="nav-link">Регистрация</a>
      <div class="theme-toggle-simple">
        <button class="theme-option" id="darkThemeBtn" onclick="setTheme('dark')" title="Тъмен режим">
          <span class="theme-icon">🌙</span>
        </button>
        <button class="theme-option" id="lightThemeBtn" onclick="setTheme('light')" title="Светъл режим">
          <span class="theme-icon">☀️</span>
        </button>
      </div>
    </div>
  </div>
</nav>

<main class="auth-main">
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-logo">BMW</div>
      <h1 class="auth-title">Вход</h1>
      <p class="auth-subtitle">Достъп до вашия гараж и история на търсения</p>
    </div>

    <div th:if="${loginError}" class="alert-error">
      <span class="alert-icon">⚠</span>
      Невалиден имейл или парола
    </div>

    <div th:if="${registrationSuccess}" class="alert-success">
      <span class="alert-icon">✓</span>
      Регистрацията успешна! Моля, влезте.
    </div>

    <form class="auth-form" th:action="@{/do-login}" method="POST">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="username" required />
      </div>
      <div class="form-group">
        <label for="password">Парола</label>
        <input type="password" id="password" name="password" required />
      </div>
      <button type="submit" class="btn-auth">Вход</button>
    </form>

    <div class="auth-footer">
      Нямате акаунт? <a href="/register">Регистрирайте се тук</a>
    </div>
  </div>
</main>

<footer class="site-footer">
  <div class="footer-inner">
    <span>BMW Каталог с части © 2024</span>
    <span>Данни от NHTSA и BMW OEM база данни</span>
  </div>
</footer>

</body>
</html>
